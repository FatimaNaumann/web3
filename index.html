<!DOCTYPE html>
<html lang="en">
<head> 
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>F1 Pit Stop</title>
</head>
<body>

  <h1>F1 Pit Stop</h1>
  <p>Select an F1 team to visit their official website!</p>
    
  <div class="grid-container">
      
    <div class="team-card">
      <a class="logo-box" href="https://www.mercedesamgf1.com/" target="_blank">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/fb/Mercedes_AMG_Petronas_F1_Logo.svg/512px-Mercedes_AMG_Petronas_F1_Logo.svg.png" alt="Mercedes Logo">
      </a>
      <h3>Mercedes</h3>
    </div>
      
    <div class="team-card">
      <a class="logo-box" href="https://www.mclaren.com/racing/" target="_blank">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/33/McLaren_racing_logo.svg/512px-McLaren_racing_logo.svg.png" alt="McLaren Logo">
      </a>
      <h3>McLaren</h3>
    </div>
       
    <div class="team-card">
      <a class="logo-box" href="https://www.williamsf1.com/" target="_blank">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/77/Williams_Racing_logo.svg/512px-Williams_Racing_logo.svg.png" alt="Williams Logo">
      </a>
      <h3>Williams</h3>
    </div>

  </div>

</body>
</html>
