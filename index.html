<!DOCTYPE html>
<html>
<head>
    <title>F1 Pit Stop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div>
        <h1>F1 Pit Stop</h1>
        <p>Select an F1 team to visit their official website!</p>
    </div>

    <div class="my-grid">

        <div class="team-box">
            <a href="https://www.mercedesamgf1.com/" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/fb/Mercedes_AMG_Petronas_F1_Logo.svg/512px-Mercedes_AMG_Petronas_F1_Logo.svg.png" alt="Mercedes F1 Logo">
            </a>
            <h3>Mercedes</h3>
        </div>

        <div class="team-box">
            <a href="https://www.mclaren.com/racing/" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/33/McLaren_racing_logo.svg/512px-McLaren_racing_logo.svg.png" alt="McLaren F1 Logo">
            </a>
            <h3>McLaren</h3>
        </div>

        <div class="team-box">
            <a href="https://www.williamsf1.com/" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/77/Williams_Racing_logo.svg/512px-Williams_Racing_logo.svg.png" alt="Williams F1 Logo">
            </a>
            <h3>Williams</h3>
        </div>

    </div>

</body>
</html>
