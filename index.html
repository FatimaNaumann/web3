<!DOCTYPE html>
<html lang="en">
<head> 
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1 Pit Stop</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 40px 20px;
    }

    h1 {
      font-size: 40px;
      color: #ff1801;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    p {
      color: #aaaaaa;
      font-size: 18px;
      margin-bottom: 40px;
    }

    .grid-container {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      max-width: 1000px;
      margin: 0 auto;
    }

    .team-card {
      background-color: #1e1e1e;
      border: 2px solid #333333;
      border-radius: 10px;
      width: 260px;
      padding: 30px 20px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      transition: 0.2s;
    }

    .team-card:hover {
      transform: translateY(-5px);
      border-color: #ff1801;
    }

    .logo-box {
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .logo-box img {
      max-width: 80%;
      max-height: 100%;
    }

    h3 {
      font-size: 22px;
      margin: 0;
    }
  </style>
</head>
<body>

  <h1>F1 Pit Stop</h1>
  <p>Click a car to visit a team website</p>
    
  <div class="grid-container">
      
    <div class="team-card">
      <a class="logo-box" href="https://www.mercedesamgf1.com/" target="_blank">
        <img src="https://upload.wikimedia.org/wikipedia/commons/f/fb/Mercedes_AMG_Petronas_F1_Logo.svg" alt="Mercedes">
      </a>
      <h3>Mercedes</h3>
    </div>
      
    <div class="team-card">
      <a class="logo-box" href="https://www.mclaren.com/racing/" target="_blank">
        <img src="https://upload.wikimedia.org/wikipedia/en/6/66/McLaren_Racing_logo.svg" alt="McLaren">
      </a>
      <h3>McLaren</h3>
    </div>
       
    <div class="team-card">
      <a class="logo-box" href="https://www.williamsf1.com/" target="_blank">
        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c9/Williams_Racing_2020_Logo.svg" alt="Williams">
      </a>
      <h3>Williams</h3>
    </div>

  </div>

</body>
</html>
